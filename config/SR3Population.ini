[Population]
; Multipliers on the game's ambient near-field base counts (vanilla: 12 cars, 40 peds).
; Real, drivable/hittable entities. Cars clamp to 120, peds to 127. Raise gradually.
VehicleMultiplier=33.4
PedestrianMultiplier=3.0
; 1 = ignore neighbourhood/night/wanted thinning of vehicle target (target = full base count). 0 = vanilla density.
ForceFullDensity=1
; Multiplies ambient VEHICLE despawn radii and PEDESTRIAN spawn/despawn radii only (1.0 = vanilla, max 8). Does NOT touch LOD/draw distances.
DistanceMultiplier=4.0
; Engine only spawns ambient vehicles while (150 - humans) > 0; every ambient driver and ped counts. Raised here.
HumanCap=1500
; The spawner adds at most ONE car per pass; passes are 200-300 ms apart in vanilla. This divides that interval.
SpawnSpeed=4.0
; The model picker refuses a car model once this many live copies are nearby (vanilla 4). Few models are streamed, so this caps traffic.
ModelNearbyCap=40
; A road segment holding this many live cars is skipped as a spawn point (vanilla 3, highways 5).
SegmentCap=12
; Max ambient parked cars (vanilla 18; the game's own Lua setter refuses more than 18).
ParkedMax=60
; Extra multiplier on pedestrian spawn/despawn radii ONLY, on top of DistanceMultiplier (1.0 = none).
PedDistanceExtra=4.0
; HARD LIMITS: total vehicle / human slots the engine allocates at startup (vanilla 48 / 150). Everything draws from these.
; Vehicle pool max 127 here. Big values cost memory (~7.7 KB per slot) and may crash a 32-bit process.
VehiclePoolSize=500
NpcPoolSize=800
; 1 = ignore the per-model live-count cap from spawn_info (vanilla 1-6 per model) when choosing an ambient car model.
BypassModelCap=1
; Where new ambient cars appear (metres from the camera; vanilla 130). Needs a LOADED zone, so keep it inside the streamed world.
; Despawn radii still use DistanceMultiplier. Set 0 to use the full scaled ring.
SpawnRingMeters=200
; The spawner refuses to run while any (kind,class) live count would exceed its budget limit (vanilla ambient cars: 18).
; Every non-zero limit in that table is multiplied by this.
BudgetMultiplier=40
; Hardcoded cap of 75 on TOTAL humans+drivers in the spawn-budget check; raised to this.
BudgetTotal=3000
; Scales the engine's global distance scale. It ALSO drives vehicle/human LOD switching, so anything above 1.0 makes cars render in low LOD. Keep at 1.0.
GlobalDistanceScale=1.0
; More pools that the extra traffic fills (vanilla 1230 / 5280 / 50): vfx attached to cars and peds, movers, crash debris.
; Each slot costs memory (effects ~660 B, movers ~380 B, debris ~960 B). Debris max 127.
EffectPoolSize=5000
MoverPoolSize=10000
DebrisPoolSize=127
; Engine mempools that grow with every character / vehicle (skin bone matrices, animation pages, shader constants, render heap ...)
; are enlarged by this factor at start-up (some by half or double of it, see population\audit.cpp). 8 = sized for ~8x vanilla population.
ResourceScale=8
